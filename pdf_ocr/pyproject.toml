[project]
name = "pdf-ocr"
version = "0.1.0"
description = "OCR PDFs to Markdown with the qwen3.8 model hosted at llm.chtc.wisc.edu"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai==3.55.1",
    "pillow==13.0.0",
    "pypdfium2==5.15.2",
]

[project.scripts]
pdf-ocr = "pdf_ocr:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "ty==0.0.106",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "TID252"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real CHTC LLM service; needs CHTC_LLM_API_KEY (run with -m live)"]
